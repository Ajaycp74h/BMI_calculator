  .card {
    width: 340px;
    background: rgba(19,19,19,0.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,122,26,0.04);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .header .bar {
    width: 5px;
    height: 30px;
    background: var(--orange);
    border-radius: 3px;
  }

  .header h1 {
    font-size: 24px;
    margin: 0;
    color: var(--text);
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  .header h1 span { color: var(--orange); }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    margin-top: 20px;
  }

  input[type="number"] {
    width: 100%;
    padding: 13px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="number"]::placeholder { color: #5a5a56; }

  input[type="number"]:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,122,26,0.15);
  }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 14px;
    background: var(--orange);
    color: #1a0d00;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:hover { background: #ff8b3d; }
  button:active { transform: scale(0.98); background: var(--orange-dim); }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .btn-row button { margin-top: 0; }

  .btn-reset {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .btn-reset:hover {
    background: var(--bg-2);
    color: var(--text);
  }

  .btn-reset:active {
    transform: scale(0.98);
  }

  .error {
    color: #ff6b5e;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .error.show { display: block; }

  .report {
    margin-top: 22px;
    padding: 16px 18px;
    background: var(--bg-2);
    border-left: 3px solid var(--orange);
    border-radius: 8px;
    min-height: 20px;
  }

  .report .title {
    font-size: 13px;
    font-weight: 700;
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .report .value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }

  .report .category {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .report.empty .value {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="bar"></div>
    <h1>BMI <span>Calculator</span></h1>
  </div>

  <label for="weight">Weight (kg)</label>
  <input type="number" id="weight" placeholder="Example : 65">
  <div class="error" id="weightError">Enter a valid weight (greater than 0)</div>

  <label for="height">Height (m)</label>
  <input type="number" id="height" placeholder="Example : 1.72" step="0.01">
  <div class="error" id="heightError">Enter a valid height (greater than 0)</div>

  <div class="btn-row">
    <button onclick="calcBMI()">Check BMI</button>
    <button class="btn-reset" onclick="resetBMI()">Reset</button>
  </div>

  <div class="report empty" id="report">
    <div class="title">Your Report</div>
    <div class="value" id="reportValue">Fill in your details above</div>
    <div class="category" id="reportCategory"></div>
  </div>
</div>

<script>
function setEmptyReport(text) {
  const report = document.getElementById('report');
  const reportValue = document.getElementById('reportValue');
  const reportCategory = document.getElementById('reportCategory');
  report.classList.add('empty');
  reportValue.style.fontSize = '14px';
  reportValue.style.fontWeight = '400';
  reportValue.textContent = text;
  reportCategory.textContent = '';
}

function calcBMI() {
  const weightInput = document.getElementById('weight');
  const heightInput = document.getElementById('height');
  const weightError = document.getElementById('weightError');
  const heightError = document.getElementById('heightError');

  const weightRaw = weightInput.value.trim();
  const heightRaw = heightInput.value.trim();
  const weight = parseFloat(weightRaw);
  const height = parseFloat(heightRaw);

  const weightInvalid = weightRaw === '' || isNaN(weight) || weight <= 0;
  const heightInvalid = heightRaw === '' || isNaN(height) || height <= 0;

  weightError.classList.toggle('show', weightInvalid);
  heightError.classList.toggle('show', heightInvalid);
  weightInput.style.borderColor = weightInvalid ? '#ff6b5e' : 'var(--border)';
  heightInput.style.borderColor = heightInvalid ? '#ff6b5e' : 'var(--border)';

  if (weightInvalid || heightInvalid) {
    setEmptyReport('Please fix the highlighted fields');
    return;
  }

  const bmi = weight / (height * height);
  let category = '';

  if (bmi < 18.5) category = 'Underweight';
  else if (bmi < 25) category = 'Normal weight';
  else if (bmi < 30) category = 'Overweight';
  else category = 'Obese';

  const report = document.getElementById('report');
  const reportValue = document.getElementById('reportValue');
  const reportCategory = document.getElementById('reportCategory');

  report.classList.remove('empty');
  reportValue.style.fontSize = '26px';
  reportValue.style.fontWeight = '700';
  reportValue.textContent = bmi.toFixed(1);
  reportCategory.textContent = category;
}

function resetBMI() {
  document.getElementById('weight').value = '';
  document.getElementById('height').value = '';
  document.getElementById('weightError').classList.remove('show');
  document.getElementById('heightError').classList.remove('show');
  document.getElementById('weight').style.borderColor = 'var(--border)';
  document.getElementById('height').style.borderColor = 'var(--border)';
  setEmptyReport('Fill in your details above');
}
</script>

</body>
</html>
